<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form id="studentForm">
  <input type="text" id="name" placeholder="Name" required>
  <input type="text" id="roll" placeholder="Roll No" required>
  <button type="submit">Add Student</button>
</form>
<div class="container">
  <div class="row">
    <div class="col-md-6">Left</div>
    <div class="col-md-6">Right</div>
  </div>
</div>



<script>
document.getElementById('studentForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const roll = document.getElementById('roll').value.trim();

    if (!name || !roll) {
        alert('Please enter all details');
        return;
    }

    // Step 1: Get the current list of students from localStorage
    let students = JSON.parse(localStorage.getItem('students')) || [];

    // Step 2: Add the new student
    students.push({ name, roll });

    // Step 3: Save it back to localStorage
    localStorage.setItem('students', JSON.stringify(students));

    // Step 4: Optionally clear the form
    document.getElementById('studentForm').reset();

    alert('Student added!');
    
});





</script>

</body>
</html>
