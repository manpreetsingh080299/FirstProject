<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Locker</title>
<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f4f4f4;
  padding: 20px;
}
h1 {
  text-align: center;
  color: #333;
}
.book-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
  margin-top: 20px;
}
.book {
  background: #fff;
  border-radius: 8px;
  padding: 10px;
  box-shadow: 0 0 5px rgba(0,0,0,0.1);
  text-align: center;
}
.book img {
  width: 100px;
  height: 150px;
  object-fit: cover;
}
.book-title {
  margin: 10px 0;
  font-size: 16px;
  font-weight: bold;
}
button {
  background: #3498db;
  color: #fff;
  border: none;
  padding: 5px 10px;
  cursor: pointer;
  border-radius: 4px;
}
button:hover {
  background: #2980b9;
}
</style>
</head>
<body>

<h1>📖 My Book Locker</h1>

<div class="book-container" id="bookContainer">
  <!-- Books will appear here -->
</div>

<script>
// Example book data
const books = [
  { title: "Book 1", cover: "https://via.placeholder.com/100x150", link: "#" },
  { title: "Book 2", cover: "https://via.placeholder.com/100x150", link: "#" },
  { title: "Book 3", cover: "https://via.placeholder.com/100x150", link: "#" },
  { title: "Book 4", cover: "https://via.placeholder.com/100x150", link: "#" },
];

// Render books
const container = document.getElementById("bookContainer");
books.forEach(book => {
  const div = document.createElement("div");
  div.className = "book";
  div.innerHTML = `
    <img src="${book.cover}" alt="${book.title}">
    <div class="book-title">${book.title}</div>
    <a href="${book.link}" target="_blank"><button>Read</button></a>
  `;
  container.appendChild(div);
});
</script>

</body>
</html>
