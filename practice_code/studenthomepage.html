<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> Student Home Data</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    

</head>

<style>
    body {
        font-family: Arial, sans-serif;
        background: rgb(161, 155, 155);
        padding: 20px;
    }

    h1 {
        text-align: center;
        color: rgb(230, 221, 98);
        font-weight: 1000px;
    }

    table {
        margin: 20px auto;
        border-collapse: collapse;
        width: 90%;
        background: #a05151;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        background: transparent;
    }

    th,
    td {
        padding: 10px;
        border: 1px solid #ddd;
        text-align: center;
    }

    th {
        /* background: rgb(161, 155, 155); */
        color: rgb(230, 221, 98);
        background: transparent;
    }
</style>
</style>

<body>
    <div>
    <h1>Student Data</h1>

    <table>
        <thead>
            <tr>
                <th>No.</th>
                <th>First Name</th>
                <th> Last Name</th>
                <th>Roll Number</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Erase</th>
            </tr>
        </thead>
        <tbody id="myTable"></tbody>
    </table>

    <script>

        const studentlist = JSON.parse(localStorage.getItem('studentlist')) || [];

        function renderStudents() {
            const tbody = document.getElementById("myTable");

            tbody.innerHTML = '';


            if (studentlist.length === 0) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                
                cell.colSpan = 7;
                cell.textContent = 'No students registered.';
                row.appendChild(cell);
                tbody.appendChild(row);
            } else {
                studentlist.forEach((student, index) => {
                    const row = document.createElement('tr');

                    const cell1 = document.createElement('td');
                    cell1.textContent = index + 1;

                    const cell2 = document.createElement('td');
                    cell2.textContent = student.fname;

                    const cell3 = document.createElement('td');
                    cell3.textContent = student.lname;
                  const cell4 = document.createElement('td');
                    cell4.textContent = student.roll;

                    const cell5 = document.createElement('td');
                    cell5.textContent = student.email;

                    const cell6 = document.createElement('td');
                    cell6.textContent = student.phone;

                    const cell7 = document.createElement('td');
                    const delBtn = document.createElement('button');
                    delBtn.title = 'Delete'
                    delBtn.textContent = "✖";
                    delBtn.style.backgroundColor = "transparent"
                    delBtn.style.borderRadius = "10px"
                    delBtn.style.color = 'rgb(230, 221, 98)'
                    delBtn.style.border= 'none'
                    delBtn.style.width = '100%'
                    delBtn.style.height = '100%'
                    cell7.style.padding = '0%'
                    cell7.style.padding = '0%'
                    
                    
                
                    

                    delBtn.addEventListener('click', function () {

                        deleteStudent(index);

                    });

                    
                    
                    row.appendChild(cell1);
                    row.appendChild(cell2);
                    row.appendChild(cell3);
                    row.appendChild(cell4);
                    row.appendChild(cell5);
                    row.appendChild(cell6);
                    row.appendChild(cell7);
                    cell7.appendChild(delBtn);


                    tbody.appendChild(row);
                });
            }
        }
        function deleteStudent(index) {
            if (confirm('Do you want to delete this?')) {
                studentlist.splice(index, 1);
                localStorage.setItem('studentlist', JSON.stringify(studentlist));
                renderStudents();
            }
            
        }

        renderStudents();
        
    </script>
    </div>
</body>

</html>
