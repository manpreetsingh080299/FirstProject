    const apiKey ="abcd1234efgh5678ijkl9012mnop3456";
const city = "London,GB";

axios.get(`https://samples.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}`)
  .then(response => {
    const weather = response.data;
    const desc = weather.weather[0].description;
    const temp = weather.main.temp;
    document.getElementById('weather').textContent = `In ${city}: ${temp}°C, ${desc}`;
  })
  .catch(error => {
    document.getElementById('weather').textContent = 'Could not fetch weather data.';
    console.error(error);
  });
